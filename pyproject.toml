[project]
name = "brisk-ml"
version = "2.0.0"
description = "A framework that helps train machine learning models using sklearn."
authors = [{name = "BFieguth", email = "bfieguth@uoguelph.ca"}]
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "scikit-learn>=1.5.1,<2",
    "pandas>=2.2.3,<3",
    "matplotlib>=3.9.2,<4",
    "jinja2>=3.1.4,<4",
    "tqdm>=4.66.5,<5",
    "click>=8.1.7,<9",
    "seaborn>=0.13.2,<0.14",
    "joblib>=1.4.2,<2",
    "numpy>=2.1.2,<3",
    "toml>=0.10.2,<0.11",
    "plotnine>=0.14.4,<0.15",
    "openpyxl>=3.1.5,<4",
    "pydantic>=2.11.7,<3",
    "plotly>=6.1.0,<7",
    "kaleido>=1.0.0,<2",
    "shap>=0.48.0,<0.49",
    "fonttools>4.60.2",
    "orjson<=3.11.4",
    "pillow>=12.1.1",
]

[project.optional-dependencies]
ui = ["briskui>=1.0.0; python_version >= '3.11'"]

[project.scripts]
brisk = "brisk.cli.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.3.3,<9",
    "pytest-cov>=6.0.0,<7",
    "mypy>=1.13.0,<2",
    "pylint>=3.3.0,<4",
    "pandas-stubs>=2.2.3,<3",
    "types-toml>=0.10.8,<0.11",
    "types-tqdm>=4.66.0,<5",
    "types-seaborn>=0.13.2,<0.14",
    "types-openpyxl>=3.1.5,<4",
    "types-Pillow>=10.2.0,<11",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
explicit = true

[tool.uv.sources]
briskui = { index = "testpypi" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brisk"]

[tool.pytest.ini_options]
markers = [
    "unit: Unit tests that test individual components in isolation",
    "integration: Integration tests that test component interactions",
    "e2e: End-to-end tests that test complete workflows",
    "slow: Tests that take a long time to run",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
exclude = ["tests/", "dev/", "docs/"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
